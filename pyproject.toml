[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svrdun-repro"
version = "0.1.0"
description = "Reproducibility code for Spatially-Varying-Rank Deep Unfolding (SVR-DUN) hyperspectral and multispectral image fusion"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "hyperspectral", "multispectral", "image-fusion", "deep-unfolding",
    "low-rank", "reproducibility",
]
authors = [{ name = "SVR-DUN authors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "torch>=2.0",
    "pandas>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["h5py>=3.8", "tifffile>=2023.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "nbclient>=0.9",
    "nbformat>=5.9",
    "ipykernel>=6.25",
]

[project.scripts]
svrdun = "svrdun.cli:main"

[project.urls]
Repository = "https://github.com/OWNER/svr-dun-repro"
Issues = "https://github.com/OWNER/svr-dun-repro/issues"

[tool.setuptools]
packages = ["svrdun"]

[tool.setuptools.package-data]
svrdun = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that build or run the network (deselect with -m 'not slow')",
    "needs_data: tests that require a real dataset on disk",
]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are checked by line-length, not flagged twice
    "B008",   # function calls in defaults are deliberate here
    "E702",   # paired assignments on one line keep array setup compact
    "E741",   # `l` reads as "low resolution" in this domain
    "UP031",  # %-formatting is clearer for the aligned numeric output here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B007"]

[tool.coverage.run]
source = ["svrdun"]
omit = ["svrdun/figures.py"]
